<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F241B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>Controle Financeiro</title>
<style>
  :root{
    --bg:#0F241B; --card:#1A3628; --card-soft:#153020; --line:#2A4A38;
    --text:#EDF5EE; --muted:#9DBBAA; --mint:#7FE0A7; --coral:#F2A08B;
    --amber:#F2C94C; --mint-dark:#0F241B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:14px; min-height:100vh; padding-bottom:100px;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px}
  button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}

  /* cabeçalho */
  .topo{display:flex;align-items:center;justify-content:space-between}
  .nav-mes{font-size:22px;color:var(--muted);padding:4px 14px;border-radius:10px}
  .mes-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center}

  /* saldo */
  .saldo{text-align:center;margin:10px 0 4px}
  .btn-olho{font-size:15px;color:var(--muted);padding:2px 8px;vertical-align:middle}
  .saldo .rotulo{font-size:12px;color:var(--muted);margin-bottom:4px}
  .saldo .valor{font-size:17px;font-weight:700;display:inline-block}
  .previsto{text-align:center;font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.5}
  .previsto b{color:var(--text)}

  /* cards resumo */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
  .card{background:var(--card);border-radius:14px;padding:11px 14px}
  .card .rotulo{font-size:11px;color:var(--muted)}
  .card .num{font-size:16px;font-weight:700;margin-top:2px}

  .secao{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .bloco{background:var(--card);border-radius:14px;padding:16px;margin-bottom:20px}

  /* gráfico de rosca */
  .rosca-area{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:8px}
  .rosca-area svg{display:block}
  .cat-linha{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;width:100%}
  .ponto{width:8px;height:8px;border-radius:4px;flex-shrink:0}
  .cat-linha .pct{font-size:11px;color:var(--muted)}
  .cat-linha .val{min-width:82px;text-align:right;font-size:13px;font-weight:600}

  /* itens de lançamento */
  .item{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
  .item.plano{background:var(--card-soft);border:1px dashed var(--line)}
  .item .dia{font-size:10px;color:var(--muted);width:32px;flex-shrink:0}
  .item .dia.vencido{color:var(--coral);font-weight:700}
  .item .meio{flex:1;min-width:0}
  .item .desc{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .cat{font-size:10px;color:var(--muted);margin-top:1px}
  .item .vlr{font-size:12px;font-weight:700;flex-shrink:0}
  .item .acao{font-size:13px;color:var(--muted);padding:6px 4px}
  .badge-rec{font-size:10px;color:var(--amber)}
  .chk{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;background:transparent}
  .chk.on{background:var(--mint);border-color:var(--mint)}
  .chk svg{display:block}
  .vazio{background:var(--card-soft);border-radius:14px;padding:20px;text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.6}
  .vazio b{color:var(--mint)}

  .cor-mint{color:var(--mint)} .cor-coral{color:var(--coral)} .cor-amber{color:var(--amber)}

  /* recorrências ativas */
  .link-rec{font-size:12px;color:var(--muted);text-decoration:underline;padding:4px 0;margin-bottom:16px;display:inline-block}
  .rec-regra{display:flex;align-items:center;gap:8px;background:var(--card-soft);border-radius:12px;padding:10px 12px;margin-bottom:7px;font-size:13px}
  .rec-regra .freq{font-size:11px;color:var(--amber);margin-top:2px}

  /* botão flutuante */
  .fab{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--mint);color:var(--mint-dark);font-size:15px;font-weight:700;
    padding:13px 26px;border-radius:28px;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:5;
  }

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(6,16,11,.7);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .overlay.aberto{display:flex}
  .folha{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
  .toggle2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .toggle3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
  .toggle2 button,.toggle3 button{padding:11px 4px;border-radius:12px;font-size:13px;font-weight:600;background:var(--card-soft);color:var(--muted)}
  .ativo-despesa{background:var(--coral)!important;color:var(--mint-dark)!important}
  .ativo-receita{background:var(--mint)!important;color:var(--mint-dark)!important}
  .ativo-neutro{background:var(--amber)!important;color:var(--mint-dark)!important}
  label{font-size:12px;color:var(--muted);display:block}
  .dica{font-size:12px;color:var(--amber);margin:-8px 0 14px;min-height:0}
  input,select{
    width:100%;background:var(--card-soft);border:1px solid var(--line);border-radius:12px;
    color:var(--text);font-size:16px;padding:13px 14px;margin:6px 0 14px;outline:none;font-family:inherit;
  }
  input#valor{font-size:22px}
  input:focus{border-color:var(--mint)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
  .chip{padding:7px 12px;font-size:13px;border-radius:20px;background:var(--card-soft);border:1px solid var(--line);font-weight:600}
  .chip.sel{background:var(--mint);color:var(--mint-dark);border-color:var(--mint)}
  .chip.nova{background:transparent;color:var(--mint);border:1px dashed var(--mint)}
  .linha-nova{display:none;gap:8px;margin-bottom:14px}
  .linha-nova.aberta{display:flex}
  .linha-nova input{margin:0;flex:1}
  .linha-nova button{background:var(--mint);color:var(--mint-dark);border-radius:12px;padding:10px 16px;font-weight:600}
  .erro{color:var(--coral);font-size:13px;margin-bottom:10px;display:none}
  .acoes{display:grid;grid-template-columns:1fr 2fr;gap:8px}
  .acoes .cancelar{background:var(--card-soft);color:var(--muted);border-radius:12px;padding:13px 0;font-weight:600;font-size:14px}
  .acoes .salvar{background:var(--mint);color:var(--mint-dark);border-radius:12px;padding:13px 0;font-size:15px;font-weight:700}

  .rodape{display:flex;justify-content:center;margin-top:8px}
  .btn-csv{font-size:12px;color:var(--muted);text-decoration:underline;padding:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topo">
    <button class="nav-mes" onclick="mudarMes(-1)" aria-label="Mês anterior">‹</button>
    <div class="mes-label" id="mesLabel"></div>
    <button class="nav-mes" onclick="mudarMes(1)" aria-label="Próximo mês">›</button>
  </div>

  <div class="saldo">
    <span class="rotulo">saldo do mês:</span>
    <span class="valor mono" id="saldoValor">R$ 0,00</span>
    <button class="btn-olho" onclick="alternarOculto()" id="btnOlho" aria-label="Ocultar valores"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <div class="previsto" id="previstoLinha"></div>

  <div class="grid2">
    <div class="card"><div class="rotulo">Receitas</div><div class="num mono cor-mint" id="recValor">R$ 0,00</div></div>
    <div class="card"><div class="rotulo">Despesas</div><div class="num mono cor-coral" id="despValor">R$ 0,00</div></div>
  </div>

  <div id="secaoPlanejados"></div>
  <div id="secaoRecorrencias"></div>
  <div id="secaoCategorias"></div>

  <div class="secao">Lançamentos</div>
  <div id="listaLancamentos"></div>

  <div class="rodape"><button class="btn-csv" onclick="exportarCSV()">Exportar CSV</button></div>
</div>

<button class="fab" onclick="abrirForm()">+ Adicionar</button>

<!-- Formulário -->
<div class="overlay" id="overlay" onclick="if(event.target===this)fecharForm()">
  <div class="folha">
    <div class="toggle2">
      <button onclick="setTipo('despesa')" id="btnDespesa">Despesa</button>
      <button onclick="setTipo('receita')" id="btnReceita">Receita</button>
    </div>

    <div class="toggle2" id="blocoStatus">
      <button onclick="setStatus('efetivado')" id="btnEfetivado">Já pago / recebido</button>
      <button onclick="setStatus('planejado')" id="btnPlanejado">Planejado (futuro)</button>
    </div>

    <div class="toggle2" id="blocoEscopo" style="display:none">
      <button onclick="setEscopo('so')" id="btnEscopoSo">Só esta ocorrência</button>
      <button onclick="setEscopo('todas')" id="btnEscopoTodas">Todas as futuras</button>
    </div>

    <div id="blocoFreq">
    <label>Repetir</label>
    <div class="toggle3">
      <button onclick="setFreq('unica')" id="btnUnica">Não</button>
      <button onclick="setFreq('semanal')" id="btnSemanal">Toda semana</button>
      <button onclick="setFreq('mensal')" id="btnMensal">Todo mês</button>
    </div>
    <div class="dica" id="dicaFreq"></div>
    </div>

    <label for="valor">Valor (R$)</label>
    <input id="valor" inputmode="numeric" placeholder="0,00" oninput="mascaraValor(this)">

    <label for="descricao">Descrição (opcional)</label>
    <input id="descricao" placeholder="Ex.: aluguel, cartão, salário…">

    <label for="dataInput">Data <span id="dicaData" style="color:var(--amber)"></span></label>
    <input type="date" id="dataInput" onchange="atualizarDicaFreq()">

    <label>Categoria</label>
    <div class="chips" id="chipsCats"></div>
    <div class="linha-nova" id="linhaNova">
      <input id="novaCat" placeholder="Nome da categoria">
      <button onclick="criarCategoria()">Criar</button>
    </div>

    <div class="erro" id="erroMsg"></div>

    <div class="acoes">
      <button class="cancelar" onclick="fecharForm()">Cancelar</button>
      <button class="salvar" id="btnSalvar" onclick="salvarLancamento()">Salvar lançamento</button>
    </div>
  </div>
</div>

<script>
// ─── Constantes ─────────────────────────────────────────────────────
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS_SEMANA=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const CORES=["#7FE0A7","#F2C94C","#F2A08B","#8FC1E8","#C9A0F2","#E88FB4","#A8E86F","#9DBBAA","#E8C08F","#7FD0E0"];
const CATS_PADRAO={despesa:["Alimentação","Mercado","Transporte","Moradia","Saúde","Lazer","Educação","Outros"],receita:["Salário","Freelance","Investimentos","Outros"]};

let dados = carregar();
let mesAtual = (()=>{const d=new Date();return{ano:d.getFullYear(),mes:d.getMonth()}})();
let fTipo="despesa", fStatus="efetivado", fCategoria="", fFreq="unica";
let mostrarRegras=false;
let editandoId=null;
let editandoRec=null;   // {recId, data} — ocorrência recorrente em edição
let editandoRegra=null; // id da regra em edição
let fEscopo="so";

function carregar(){
  try{
    const raw = localStorage.getItem("financas-v1");
    if(raw){
      const d=JSON.parse(raw);
      return {
        transacoes:d.transacoes||[],
        categorias:d.categorias||JSON.parse(JSON.stringify(CATS_PADRAO)),
        recorrencias:d.recorrencias||[],
        excecoes:d.excecoes||{}
      };
    }
  }catch(e){}
  return {transacoes:[],categorias:JSON.parse(JSON.stringify(CATS_PADRAO)),recorrencias:[],excecoes:{}};
}
function persistir(){ try{ localStorage.setItem("financas-v1", JSON.stringify(dados)); }catch(e){ alert("Não foi possível salvar os dados neste navegador."); } }

// ─── Utilidades ─────────────────────────────────────────────────────
const ICO_CHECK='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0F241B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const ICO_OLHO='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICO_OLHO_OFF='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
let oculto = localStorage.getItem("financas-oculto")==="1";
const fmt = v => oculto ? "R$ \u2022\u2022\u2022\u2022" : v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function alternarOculto(){
  oculto=!oculto;
  localStorage.setItem("financas-oculto", oculto?"1":"0");
  document.getElementById("btnOlho").innerHTML = oculto?ICO_OLHO_OFF:ICO_OLHO;
  render();
}
const hojeISO = ()=>{const d=new Date();return isoDe(d.getFullYear(),d.getMonth()+1,d.getDate())};
const isoDe = (a,m,d)=>`${a}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const parseValor = s => { const n=parseFloat(String(s).replace(/\./g,"").replace(",",".")); return isNaN(n)?0:n; };
function mascaraValor(el){
  const dig = el.value.replace(/\D/g,"").slice(0,12);
  if(!dig){ el.value=""; return; }
  el.value = (parseInt(dig,10)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const diasNoMes = (a,m)=> new Date(a,m+1,0).getDate(); // m 0-indexado

// ─── Recorrências: ocorrências do mês ───────────────────────────────
function ocorrenciasNoMes(rec, ano, mes){ // mes 0-indexado
  const out=[];
  const nDias = diasNoMes(ano,mes);
  if(rec.freq==="semanal"){
    for(let d=1; d<=nDias; d++){
      const dt = new Date(ano,mes,d);
      const iso = isoDe(ano,mes+1,d);
      if(dt.getDay()===rec.diaSemana && iso>=rec.inicio) out.push(iso);
    }
  } else if(rec.freq==="mensal"){
    const dia = Math.min(rec.diaMes, nDias);
    const iso = isoDe(ano,mes+1,dia);
    // inclui a partir do MÊS de início (mesmo que o dia já tenha passado nele)
    if(iso.slice(0,7) >= rec.inicio.slice(0,7)) out.push(iso);
  }
  return out;
}
function virtuaisDoMes(ano,mes){
  const out=[];
  dados.recorrencias.forEach(rec=>{
    ocorrenciasNoMes(rec,ano,mes).forEach(iso=>{
      const ex = (dados.excecoes[rec.id]||{})[iso];
      if(!ex) out.push({recId:rec.id,tipo:rec.tipo,valor:rec.valor,descricao:rec.descricao,categoria:rec.categoria,data:iso,freq:rec.freq});
    });
  });
  return out;
}
function marcarExcecao(recId,iso,tipo){
  if(!dados.excecoes[recId]) dados.excecoes[recId]={};
  dados.excecoes[recId][iso]=tipo;
}

// ─── Renderização ───────────────────────────────────────────────────
function render(){
  document.getElementById("mesLabel").textContent = `${MESES[mesAtual.mes]} ${mesAtual.ano}`;

  const doMes = dados.transacoes.filter(t=>{const [a,m]=t.data.split("-").map(Number); return a===mesAtual.ano && m-1===mesAtual.mes;});
  const efet = doMes.filter(t=>t.status==="efetivado");
  const planFixos = doMes.filter(t=>t.status==="planejado");
  const planVirtuais = virtuaisDoMes(mesAtual.ano, mesAtual.mes);
  const plan = [...planFixos, ...planVirtuais].sort((a,b)=>a.data<b.data?-1:1);

  const rec = efet.filter(t=>t.tipo==="receita").reduce((s,t)=>s+t.valor,0);
  const desp = efet.filter(t=>t.tipo==="despesa").reduce((s,t)=>s+t.valor,0);
  const saldo = rec-desp;
  const recPlan = plan.filter(t=>t.tipo==="receita").reduce((s,t)=>s+t.valor,0);
  const despPlan = plan.filter(t=>t.tipo==="despesa").reduce((s,t)=>s+t.valor,0);
  const previsto = saldo + recPlan - despPlan;

  const sv = document.getElementById("saldoValor");
  sv.textContent = fmt(saldo);
  sv.className = "valor mono " + (saldo>=0?"cor-mint":"cor-coral");

  document.getElementById("previstoLinha").innerHTML = plan.length
    ? `previsto no fim do mês: <b class="mono ${previsto>=0?"cor-mint":"cor-coral"}">${fmt(previsto)}</b><br>a pagar ${fmt(despPlan)}${recPlan?` · a receber ${fmt(recPlan)}`:""}`
    : "";

  document.getElementById("recValor").textContent = fmt(rec);
  document.getElementById("despValor").textContent = fmt(desp);

  // ── Planejados (fixos + recorrentes)
  const sp = document.getElementById("secaoPlanejados");
  if(plan.length){
    const hoje = hojeISO();
    sp.innerHTML = `<div class="secao">Planejados (a pagar / a receber)</div>` + plan.map(t=>{
      const [,m,d]=t.data.split("-");
      const vencido = t.tipo==="despesa" && t.data < hoje;
      const ehRec = !!t.recId;
      const chave = ehRec ? `'${t.recId}','${t.data}'` : t.id;
      return `<div class="item plano" onclick="${ehRec?`editarRec(${chave})`:`editar(${t.id})`}">
        <button class="chk" onclick="event.stopPropagation();${ehRec?`efetivarRec(${chave})`:`efetivar(${chave})`}" aria-label="Marcar como pago"></button>
        <div class="dia mono ${vencido?"vencido":""}">${d}/${m}</div>
        <div class="meio">
          <div class="desc">${esc(t.descricao||t.categoria)}${vencido?' <span class="cor-coral">· vencido</span>':""}</div>
          <div class="cat">${esc(t.categoria)}${ehRec?` <span class="badge-rec">↻ ${t.freq==="semanal"?"semanal":"mensal"}</span>`:""}</div>
        </div>
        <div class="vlr mono ${t.tipo==="receita"?"cor-mint":"cor-amber"}">${t.tipo==="receita"?"+":"−"}${fmt(t.valor)}</div>
        <button class="acao" onclick="event.stopPropagation();${ehRec?`pularRec(${chave})`:`remover(${chave})`}" aria-label="Excluir">✕</button>
      </div>`;
    }).join("");
  } else sp.innerHTML = "";

  // ── Recorrências ativas (gerenciar)
  const sr = document.getElementById("secaoRecorrencias");
  if(dados.recorrencias.length){
    let html = `<button class="link-rec" onclick="mostrarRegras=!mostrarRegras;render()">${mostrarRegras?"▾":"▸"} Recorrências ativas (${dados.recorrencias.length})</button>`;
    if(mostrarRegras){
      html += dados.recorrencias.map(r=>{
        const quando = r.freq==="semanal" ? `toda ${DIAS_SEMANA[r.diaSemana]}` : `todo dia ${r.diaMes}`;
        return `<div class="rec-regra" onclick="editarRegra(${r.id})" style="cursor:pointer">
          <div class="meio" style="flex:1;min-width:0">
            <div>${esc(r.descricao||r.categoria)}</div>
            <div class="freq">↻ ${quando} · ${esc(r.categoria)}</div>
          </div>
          <div class="vlr mono ${r.tipo==="receita"?"cor-mint":"cor-coral"}" style="font-size:13px">${r.tipo==="receita"?"+":"−"}${fmt(r.valor)}</div>
          <button class="acao" onclick="event.stopPropagation();removerRegra(${r.id})" aria-label="Encerrar recorrência">✕</button>
        </div>`;
      }).join("");
    }
    sr.innerHTML = html;
  } else sr.innerHTML = "";

  // ── Gráfico de rosca: gastos por categoria (despesas efetivadas)
  const porCat={};
  efet.filter(t=>t.tipo==="despesa").forEach(t=>{porCat[t.categoria]=(porCat[t.categoria]||0)+t.valor;});
  const cats = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const sc = document.getElementById("secaoCategorias");
  if(cats.length){
    const R=54, STROKE=26, C=2*Math.PI*R;
    let off=0;
    const arcos = cats.map(([c,v],i)=>{
      const frac=v/desp;
      const seg=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${CORES[i%CORES.length]}"
        stroke-width="${STROKE}" stroke-dasharray="${(frac*C).toFixed(2)} ${C.toFixed(2)}"
        stroke-dashoffset="${(-off*C).toFixed(2)}" transform="rotate(-90 80 80)"/>`;
      off+=frac;
      return seg;
    }).join("");
    sc.innerHTML = `<div class="bloco"><div class="secao">Gastos por categoria</div>
      <div class="rosca-area">
        <svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Gráfico de gastos por categoria">
          ${arcos}
          <text x="80" y="74" text-anchor="middle" fill="#9DBBAA" font-size="11" font-family="system-ui">total</text>
          <text x="80" y="92" text-anchor="middle" fill="#EDF5EE" font-size="14" font-weight="700"
            font-family="ui-monospace,Menlo,monospace">${fmt(desp)}</text>
        </svg>
        <div style="width:100%">
        ${cats.map(([c,v],i)=>`<div class="cat-linha">
          <span class="ponto" style="background:${CORES[i%CORES.length]}"></span>
          <span style="flex:1">${esc(c)}</span>
          <span class="pct mono">${Math.round(v/desp*100)}%</span>
          <span class="val mono">${fmt(v)}</span>
        </div>`).join("")}
        </div>
      </div></div>`;
  } else sc.innerHTML = "";

  // ── Lançamentos efetivados
  const ll = document.getElementById("listaLancamentos");
  const ordenados = [...efet].sort((a,b)=>a.data<b.data?1:-1);
  ll.innerHTML = ordenados.length ? ordenados.map(t=>{
    const [,m,d]=t.data.split("-");
    return `<div class="item" onclick="editar(${t.id})">
      <button class="chk on" onclick="event.stopPropagation();desfazer(${t.id})" aria-label="Desmarcar pagamento">${ICO_CHECK}</button>
      <div class="dia mono">${d}/${m}</div>
      <div class="meio"><div class="desc">${esc(t.descricao||t.categoria)}</div><div class="cat">${esc(t.categoria)}${t.recId?' <span class="badge-rec">↻</span>':""}</div></div>
      <div class="vlr mono ${t.tipo==="receita"?"cor-mint":"cor-coral"}">${t.tipo==="receita"?"+":"−"}${fmt(t.valor)}</div>
      <button class="acao" onclick="event.stopPropagation();remover(${t.id})" aria-label="Excluir">✕</button>
    </div>`;
  }).join("") : `<div class="vazio">Nenhum lançamento efetivado neste mês.<br>Toque em <b>+ Adicionar</b> para começar.</div>`;
}

function mudarMes(delta){
  let m=mesAtual.mes+delta, a=mesAtual.ano;
  if(m<0){m=11;a--} if(m>11){m=0;a++}
  mesAtual={ano:a,mes:m}; render();
}

// ─── Ações ──────────────────────────────────────────────────────────
function efetivar(id){
  const t = dados.transacoes.find(x=>x.id===id);
  if(t){ t.status="efetivado"; persistir(); render(); }
}
function efetivarRec(recId, iso){
  const r = dados.recorrencias.find(x=>String(x.id)===String(recId));
  if(!r) return;
  dados.transacoes.unshift({id:Date.now(),tipo:r.tipo,status:"efetivado",valor:r.valor,descricao:r.descricao,categoria:r.categoria,data:iso,recId});
  marcarExcecao(recId,iso,"efetivado");
  persistir(); render();
}
function pularRec(recId, iso){
  marcarExcecao(recId,iso,"removido");
  persistir(); render();
}
function removerRegra(id){
  if(!confirm("Encerrar esta recorrência? Os lançamentos já efetivados serão mantidos.")) return;
  dados.recorrencias = dados.recorrencias.filter(r=>r.id!==id);
  delete dados.excecoes[id];
  persistir(); render();
}
function desfazer(id){
  const t = dados.transacoes.find(x=>x.id===id);
  if(!t) return;
  if(t.recId){
    // veio de uma recorrência: remove o lançamento e a ocorrência volta a aparecer como planejada
    if(dados.excecoes[t.recId]) delete dados.excecoes[t.recId][t.data];
    dados.transacoes = dados.transacoes.filter(x=>x.id!==id);
  } else {
    t.status = "planejado";
  }
  persistir(); render();
}
function remover(id){
  dados.transacoes = dados.transacoes.filter(x=>x.id!==id);
  persistir(); render();
}
function exportarCSV(){
  const linhas = [["data","tipo","status","categoria","descricao","valor","recorrente"]];
  [...dados.transacoes].sort((a,b)=>a.data<b.data?-1:1).forEach(t=>{
    linhas.push([t.data,t.tipo,t.status,t.categoria,(t.descricao||"").replace(/;/g,","),String(t.valor).replace(".",","),t.recId?"sim":"não"]);
  });
  const csv = "\uFEFF"+linhas.map(l=>l.join(";")).join("\n");
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "financas.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

// ─── Formulário ─────────────────────────────────────────────────────
function abrirForm(){
  editandoId=null; editandoRec=null; editandoRegra=null;
  document.getElementById("blocoEscopo").style.display="none";
  fCategoria=""; fStatus="efetivado"; fFreq="unica";
  document.getElementById("valor").value="";
  document.getElementById("descricao").value="";
  document.getElementById("dataInput").value=hojeISO();
  document.getElementById("erroMsg").style.display="none";
  document.getElementById("linhaNova").classList.remove("aberta");
  document.getElementById("blocoFreq").style.display="block";
  document.getElementById("btnSalvar").textContent="Salvar lançamento";
  setTipo(fTipo); setStatus(fStatus); setFreq(fFreq);
  document.getElementById("overlay").classList.add("aberto");
}
function setEscopo(e){
  fEscopo=e;
  document.getElementById("btnEscopoSo").className = e==="so"?"ativo-neutro":"";
  document.getElementById("btnEscopoTodas").className = e==="todas"?"ativo-neutro":"";
}
function editarRec(recId, iso){
  const r = dados.recorrencias.find(x=>String(x.id)===String(recId));
  if(!r) return;
  editandoRec={recId:String(recId), data:iso}; editandoId=null; editandoRegra=null;
  document.getElementById("valor").value=r.valor.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById("descricao").value=r.descricao||"";
  document.getElementById("dataInput").value=iso;
  document.getElementById("erroMsg").style.display="none";
  document.getElementById("linhaNova").classList.remove("aberta");
  document.getElementById("blocoFreq").style.display="none";
  document.getElementById("blocoStatus").style.display="none";
  document.getElementById("blocoEscopo").style.display="grid";
  document.getElementById("btnSalvar").textContent="Salvar alterações";
  setTipo(r.tipo);
  fCategoria=r.categoria; renderChips();
  setEscopo("so");
  document.getElementById("overlay").classList.add("aberto");
}
function editarRegra(id){
  const r = dados.recorrencias.find(x=>x.id===id);
  if(!r) return;
  editandoRegra=id; editandoId=null; editandoRec=null;
  document.getElementById("valor").value=r.valor.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById("descricao").value=r.descricao||"";
  document.getElementById("dataInput").value=r.inicio;
  document.getElementById("erroMsg").style.display="none";
  document.getElementById("linhaNova").classList.remove("aberta");
  document.getElementById("blocoFreq").style.display="block";
  document.getElementById("blocoEscopo").style.display="none";
  document.getElementById("btnSalvar").textContent="Salvar alterações";
  setTipo(r.tipo);
  fCategoria=r.categoria; renderChips();
  setFreq(r.freq);
  document.getElementById("overlay").classList.add("aberto");
}
function editar(id){
  const t = dados.transacoes.find(x=>x.id===id);
  if(!t) return;
  editandoId=id; editandoRec=null; editandoRegra=null;
  document.getElementById("blocoEscopo").style.display="none";
  document.getElementById("valor").value=t.valor.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById("descricao").value=t.descricao||"";
  document.getElementById("dataInput").value=t.data;
  document.getElementById("erroMsg").style.display="none";
  document.getElementById("linhaNova").classList.remove("aberta");
  // itens que já pertencem a uma recorrência não podem virar outra
  document.getElementById("blocoFreq").style.display = t.recId ? "none" : "block";
  document.getElementById("btnSalvar").textContent="Salvar alterações";
  setTipo(t.tipo);
  fCategoria=t.categoria; renderChips();
  setFreq("unica");
  setStatus(t.status);
  document.getElementById("blocoStatus").style.display="grid";
  document.getElementById("overlay").classList.add("aberto");
}
function fecharForm(){ document.getElementById("overlay").classList.remove("aberto"); }

function setTipo(t){
  fTipo=t; fCategoria="";
  document.getElementById("btnDespesa").className = t==="despesa"?"ativo-despesa":"";
  document.getElementById("btnReceita").className = t==="receita"?"ativo-receita":"";
  renderChips();
}
function setStatus(s){
  fStatus=s;
  document.getElementById("btnEfetivado").className = s==="efetivado"?"ativo-receita":"";
  document.getElementById("btnPlanejado").className = s==="planejado"?"ativo-neutro":"";
  document.getElementById("dicaData").textContent = s==="planejado"?"(vencimento / previsão)":"";
}
function setFreq(f){
  fFreq=f;
  document.getElementById("btnUnica").className = f==="unica"?"ativo-receita":"";
  document.getElementById("btnSemanal").className = f==="semanal"?"ativo-neutro":"";
  document.getElementById("btnMensal").className = f==="mensal"?"ativo-neutro":"";
  // recorrente sempre gera "planejados" automáticos; esconde o toggle de status
  document.getElementById("blocoStatus").style.display = f==="unica"?"grid":"none";
  atualizarDicaFreq();
}
function atualizarDicaFreq(){
  const el=document.getElementById("dicaFreq");
  const data=document.getElementById("dataInput").value || hojeISO();
  const [a,m,d]=data.split("-").map(Number);
  const dt=new Date(a,m-1,d);
  if(fFreq==="semanal") el.textContent=`↻ Vai repetir toda ${DIAS_SEMANA[dt.getDay()]}, a partir de ${String(d).padStart(2,"0")}/${String(m).padStart(2,"0")}`;
  else if(fFreq==="mensal") el.textContent=`↻ Vai repetir todo dia ${d} de cada mês, a partir de ${MESES[m-1]}`;
  else el.textContent="";
}
function renderChips(){
  const box=document.getElementById("chipsCats");
  box.innerHTML = dados.categorias[fTipo].map(c=>
    `<button class="chip ${fCategoria===c?"sel":""}" onclick="selCat('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</button>`
  ).join("") + `<button class="chip nova" onclick="document.getElementById('linhaNova').classList.toggle('aberta')">+ nova</button>`;
}
function selCat(c){ fCategoria=c; renderChips(); }
function criarCategoria(){
  const nome=document.getElementById("novaCat").value.trim();
  if(!nome) return;
  if(!dados.categorias[fTipo].includes(nome)){ dados.categorias[fTipo].push(nome); persistir(); }
  fCategoria=nome;
  document.getElementById("novaCat").value="";
  document.getElementById("linhaNova").classList.remove("aberta");
  renderChips();
}
function salvarLancamento(){
  const v=parseValor(document.getElementById("valor").value);
  const err=document.getElementById("erroMsg");
  if(v<=0){ err.textContent="Informe um valor maior que zero."; err.style.display="block"; return; }
  if(!fCategoria){ err.textContent="Escolha uma categoria."; err.style.display="block"; return; }
  const data=document.getElementById("dataInput").value || hojeISO();
  const desc=document.getElementById("descricao").value.trim();
  const [a,m,d]=data.split("-").map(Number);

  if(editandoRec){
    const rec = editandoRec; editandoRec=null;
    if(fEscopo==="so"){
      // esta ocorrência vira um lançamento próprio; a regra pula esta data
      marcarExcecao(rec.recId, rec.data, "removido");
      dados.transacoes.unshift({id:Date.now(),tipo:fTipo,status:"planejado",valor:v,descricao:desc,categoria:fCategoria,data});
    } else {
      const r = dados.recorrencias.find(x=>String(x.id)===String(rec.recId));
      if(r){
        r.tipo=fTipo; r.valor=v; r.descricao=desc; r.categoria=fCategoria;
        if(r.freq==="semanal") r.diaSemana=new Date(a,m-1,d).getDay();
        else r.diaMes=d;
        if(data < r.inicio) r.inicio=data;
      }
    }
  } else if(editandoRegra){
    const rid = editandoRegra; editandoRegra=null;
    const r = dados.recorrencias.find(x=>x.id===rid);
    if(r){
      if(fFreq==="unica"){
        // deixa de repetir: encerra a regra e vira um lançamento único planejado
        dados.recorrencias = dados.recorrencias.filter(x=>x.id!==rid);
        delete dados.excecoes[rid];
        dados.transacoes.unshift({id:Date.now(),tipo:fTipo,status:"planejado",valor:v,descricao:desc,categoria:fCategoria,data});
      } else {
        r.tipo=fTipo; r.valor=v; r.descricao=desc; r.categoria=fCategoria; r.freq=fFreq;
        delete r.diaSemana; delete r.diaMes;
        if(fFreq==="semanal") r.diaSemana=new Date(a,m-1,d).getDay();
        else r.diaMes=d;
        if(data < r.inicio) r.inicio=data;
      }
    }
  } else if(editandoId){
    const t = dados.transacoes.find(x=>x.id===editandoId);
    if(t){
      if(fFreq!=="unica" && !t.recId){
        // transformar este lançamento em recorrente
        const regra={id:Date.now(),tipo:fTipo,valor:v,descricao:desc,categoria:fCategoria,freq:fFreq,inicio:data};
        if(fFreq==="semanal") regra.diaSemana=new Date(a,m-1,d).getDay();
        else regra.diaMes=d;
        dados.recorrencias.push(regra);
        if(t.status==="efetivado"){
          // mantém o lançamento pago como a 1ª ocorrência da recorrência
          t.tipo=fTipo; t.valor=v; t.descricao=desc; t.categoria=fCategoria; t.data=data; t.recId=regra.id;
          marcarExcecao(regra.id,data,"efetivado");
        } else {
          // planejado vira ocorrência automática da regra
          dados.transacoes = dados.transacoes.filter(x=>x.id!==editandoId);
        }
      } else {
        t.tipo=fTipo; t.status=fStatus; t.valor=v; t.descricao=desc; t.categoria=fCategoria; t.data=data;
      }
    }
    editandoId=null;
  } else if(fFreq==="unica"){
    dados.transacoes.unshift({id:Date.now(),tipo:fTipo,status:fStatus,valor:v,descricao:desc,categoria:fCategoria,data});
  } else {
    const regra={id:Date.now(),tipo:fTipo,valor:v,descricao:desc,categoria:fCategoria,freq:fFreq,inicio:data};
    if(fFreq==="semanal") regra.diaSemana=new Date(a,m-1,d).getDay();
    else regra.diaMes=d;
    dados.recorrencias.push(regra);
  }
  persistir();
  mesAtual={ano:a,mes:m-1};
  fecharForm(); render();
}

render();
